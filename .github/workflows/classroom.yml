name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run Unit Tests
        run: |
          cd src/car
          go test -v ./...
          cd ../rental
          go test -v ./...
          cd ../payment
          go test -v ./...
          cd ../..

      - name: Build images
        timeout-minutes: 10
        run: docker compose -f docker-compose.test.yml build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose -f docker-compose.test.yml up -d
          export WAIT_PORTS="8080,8060,8050,8070"
          ./scripts/wait-script.sh 

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Postgres Logs ==="
          docker compose -f docker-compose.test.yml logs postgres
          echo "=== Gateway Logs ==="
          docker compose -f docker-compose.test.yml logs gateway
          echo "=== Library Logs ==="
          docker compose -f docker-compose.test.yml logs cars
          echo "=== Rating Logs ==="
          docker compose -f docker-compose.test.yml logs rental
          echo "=== Reservation Logs ==="
          docker compose -f docker-compose.test.yml logs payment

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v3/postman/collection.json
          environment: v3/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 2
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose -f docker-compose.test.yml down -v